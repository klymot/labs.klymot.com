<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     role="img" aria-label="Diagram of a thin slice near the Moon's surface, divided into three stacked boxes, showing sunlight absorbed and radiated at the top box and conduction exchanged between neighbouring boxes">
  <title>Near the surface, in profile</title>
  <desc>Three stacked boxes just below the surface. The top box absorbs sunlight by day and radiates heat to space at all times. Every box exchanges heat only with the box directly above and below it.</desc>

  <defs>
    <marker id="ts-arr-flux" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#d4a855"/>
    </marker>
    <marker id="ts-arr-lead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0,6 2,0 4" fill="#a8a090"/>
    </marker>
  </defs>

  <!-- ── Sun glyph ──────────────────────────────────────────────── -->
  <circle cx="90" cy="56" r="13" fill="rgba(212,168,85,0.15)" stroke="#d4a855" stroke-width="1.5"/>
  <line x1="106" y1="56" x2="114" y2="56" stroke="#d4a855" stroke-width="1.5"/>
  <line x1="101" y1="45" x2="107" y2="39" stroke="#d4a855" stroke-width="1.5"/>
  <line x1="90"  y1="40" x2="90"  y2="32" stroke="#d4a855" stroke-width="1.5"/>
  <line x1="79"  y1="45" x2="73"  y2="39" stroke="#d4a855" stroke-width="1.5"/>
  <line x1="74"  y1="56" x2="66"  y2="56" stroke="#d4a855" stroke-width="1.5"/>
  <line x1="79"  y1="67" x2="73"  y2="73" stroke="#d4a855" stroke-width="1.5"/>
  <line x1="90"  y1="72" x2="90"  y2="80" stroke="#d4a855" stroke-width="1.5"/>
  <line x1="101" y1="67" x2="107" y2="73" stroke="#d4a855" stroke-width="1.5"/>
  <text x="90" y="100" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#a8a090">Day side</text>

  <!-- ── Sunlight-in arrow, landing on the top box's top-left ────── -->
  <line x1="130" y1="76" x2="200" y2="122" stroke="#d4a855" stroke-width="2" marker-end="url(#ts-arr-flux)"/>
  <text x="128" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#d4a855">Sunlight absorbed</text>

  <!-- ── Radiated-to-space arrow (top box, right side) ───────────── -->
  <line x1="350" y1="126" x2="350" y2="50" stroke="#d4a855" stroke-width="2" marker-end="url(#ts-arr-flux)"/>
  <text x="360" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#d4a855">Radiated to space</text>
  <text x="360" y="81" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#a8a090" opacity="0.85">(day and night)</text>

  <!-- ── The three boxes ────────────────────────────────────────────
       box1: 126-162   box2: 162-202   box3: 202-246
       x: 180 to 380 (width 200)                                      -->
  <rect x="180" y="126" width="200" height="36" fill="#152c4a" stroke="#d4a855" stroke-width="2"/>
  <rect x="180" y="162" width="200" height="40" fill="#152c4a" stroke="#d4a855" stroke-width="2"/>
  <rect x="180" y="202" width="200" height="44" fill="#152c4a" stroke="#d4a855" stroke-width="2"/>

  <!-- ── Conduction arrows: junction 1 (y=162) ─────────────────── -->
  <line x1="255" y1="152" x2="255" y2="172" stroke="#d4a855" stroke-width="1.5" marker-end="url(#ts-arr-flux)"/>
  <line x1="300" y1="172" x2="300" y2="152" stroke="#d4a855" stroke-width="1.5" marker-end="url(#ts-arr-flux)"/>

  <!-- ── Conduction arrows: junction 2 (y=202), slightly faded ──── -->
  <line x1="255" y1="192" x2="255" y2="212" stroke="#d4a855" stroke-width="1.5" opacity="0.7" marker-end="url(#ts-arr-flux)"/>
  <line x1="300" y1="212" x2="300" y2="192" stroke="#d4a855" stroke-width="1.5" opacity="0.7" marker-end="url(#ts-arr-flux)"/>

  <!-- ── Conduction label + leader, pointing at junction 1 ───────── -->
  <line x1="155" y1="162" x2="178" y2="162" stroke="#a8a090" stroke-width="1" fill="none" marker-end="url(#ts-arr-lead)"/>
  <text x="10" y="148" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a090">Conduction:</text>
  <text x="10" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#a8a090" opacity="0.85">down by day,</text>
  <text x="10" y="178" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#a8a090" opacity="0.85">up by night</text>

  <!-- ── Box callout ──────────────────────────────────────────── -->
  <line x1="382" y1="182" x2="405" y2="182" stroke="#a8a090" stroke-width="1" fill="none" marker-end="url(#ts-arr-lead)"/>
  <text x="408" y="178" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a090">One box =</text>
  <text x="408" y="193" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a090">one temperature,</text>
  <text x="408" y="208" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a090">one composition</text>

  <!-- ── Continuation marker ─────────────────────────────────────── -->
  <line x1="180" y1="246" x2="180" y2="268" stroke="#a8a090" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="380" y1="246" x2="380" y2="268" stroke="#a8a090" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 260 268 L 280 284 L 300 268" fill="none" stroke="#a8a090" stroke-width="1.5"/>
  <text x="280" y="306" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#a8a090" opacity="0.85">continues deeper — see next diagram</text>
</svg>
