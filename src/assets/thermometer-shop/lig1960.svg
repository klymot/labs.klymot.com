  <!-- sheathed maximum -->
  <rect x="34" y="42" width="132" height="18" rx="9" stroke-width="1.2"/>
  <ellipse cx="48" cy="51" rx="7" ry="6"/>
  <path d="M55 51 h100" stroke-width="2.5"/>
  <path d="M55 51 h72" stroke="var(--accent, #d4a855)" stroke-width="2.5" opacity="0.85"/>
  <g stroke-width="1" opacity="0.7"><path d="M64 45 v4 M76 45 v4 M88 45 v4 M100 45 v4 M112 45 v4 M124 45 v4 M136 45 v4 M148 45 v4"/></g>
  <!-- sheathed minimum -->
  <rect x="34" y="78" width="132" height="18" rx="9" stroke-width="1.2"/>
  <ellipse cx="48" cy="87" rx="7" ry="6"/>
  <path d="M55 87 h100" stroke-width="2.5"/>
  <circle cx="102" cy="87" r="2.5" stroke-width="1.5"/>
  <circle cx="112" cy="87" r="2.5" stroke-width="1.5"/>
  <path d="M104 87 h6" stroke-width="1.5"/>
  <g stroke-width="1" opacity="0.7"><path d="M64 81 v4 M76 81 v4 M88 81 v4 M100 81 v4 M112 81 v4 M124 81 v4 M136 81 v4 M148 81 v4"/></g>
  <!-- calibration tag -->
  <path d="M166 30 l10 8 -4 10 -12-4 z" stroke="var(--accent, #d4a855)" stroke-width="1.5"/>
